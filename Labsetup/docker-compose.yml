version: "3"

services:
  webserver:
    image: handsonsecurity/seed-ubuntu:large
    container_name: webserver-10.9.0.5
    tty: true
    cap_add:
      - ALL
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      net-10.9.0.0:
        ipv4_address: 10.9.0.5
    command: >
      bash -c "ip route add 192.168.60.0/24 via 10.9.0.2 &&
               /etc/init.d/openbsd-inetd start &&
               tail -f /dev/null"

  attacker:
    image: handsonsecurity/seed-ubuntu:large
    container_name: attacker-10.9.0.100
    tty: true
    cap_add:
      - ALL
    networks:
      net-10.9.0.0:
        ipv4_address: 10.9.0.100
    command: >
      bash -c "ip route del default &&
               ip route add default via 10.9.0.2 &&
               /etc/init.d/openbsd-inetd start &&
               tail -f /dev/null"

  internal_host1:
    image: handsonsecurity/seed-ubuntu:large
    container_name: internal_host1-192.168.60.5
    tty: true
    cap_add:
      - ALL
    networks:
      net-192.168.60.0:
        ipv4_address: 192.168.60.5
    command: >
      bash -c "ip route del default &&
               ip route add default via 192.168.60.2 &&
               /etc/init.d/openbsd-inetd start &&
               tail -f /dev/null"

  internal_host2:
    image: handsonsecurity/seed-ubuntu:large
    container_name: internal_host2-192.168.60.6
    tty: true
    cap_add:
      - ALL
    networks:
      net-192.168.60.0:
        ipv4_address: 192.168.60.6
    command: >
      bash -c "ip route del default &&
               ip route add default via 192.168.60.2 &&
               /etc/init.d/openbsd-inetd start &&
               tail -f /dev/null"

  internal_host3:
    image: handsonsecurity/seed-ubuntu:large
    container_name: internal_host3-192.168.60.7
    tty: true
    cap_add:
      - ALL
    networks:
      net-192.168.60.0:
        ipv4_address: 192.168.60.7
    command: >
      bash -c "ip route del default &&
               ip route add default via 192.168.60.2 &&
               /etc/init.d/openbsd-inetd start &&
               tail -f /dev/null"

  router:
    build: router
    image: seed-router-image
    container_name: router-10.9.0.2
    tty: true
    cap_add:
      - ALL
    sysctls:
      net.ipv4.ip_forward: 1
    volumes:
      - ./volumes:/volumes
    networks:
      net-10.9.0.0:
        ipv4_address: 10.9.0.2
      net-192.168.60.0:
        ipv4_address: 192.168.60.2
    command: >
      bash -c "ip route del default &&
               ip route add default via 10.9.0.1 &&
               /etc/init.d/openbsd-inetd start &&
               tail -f /dev/null"

networks:
  net-192.168.60.0:
    ipam:
      config:
        - subnet: 192.168.60.0/24

  net-10.9.0.0:
    ipam:
      config:
        - subnet: 10.9.0.0/24